name: Signed Windows release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: audioflow-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      AUDIOFLOW_UPDATER_PUBLIC_KEY: ${{ vars.AUDIOFLOW_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Validate public verification key
        shell: pwsh
        run: |
          if (-not $env:AUDIOFLOW_UPDATER_PUBLIC_KEY -and -not (Test-Path src-tauri/updater.pub)) { throw 'Missing public verification key' }
      - name: Configure actual repository
        run: npm run release:configure
      - name: Validate release version
        run: npm run release:validate
      - name: Prepare versioned release notes
        id: notes
        run: node scripts/prepare-release-notes.mjs
      - name: Test routing decisions and frontend logic
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          npm test
      - name: Build and sign Windows installer as a draft
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AudioFlow ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          releaseBody: ${{ steps.notes.outputs.body }}
          generateReleaseNotes: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Verify uploaded update assets before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        shell: pwsh
        run: |
          gh release download $env:GITHUB_REF_NAME --dir artifacts --pattern 'latest.json' --pattern '*.exe' --pattern '*.sig'
          if ($LASTEXITCODE -ne 0) { throw 'Release assets could not be downloaded' }
          if ($env:RELEASE_ID -notmatch '^\d+$') { throw 'Invalid release ID' }
          gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | Out-File -FilePath artifacts/release.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata could not be downloaded' }
          node scripts/normalize-update-manifest.mjs artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Update manifest URL normalization failed' }
          npm run release:validate -- artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Update manifest validation failed' }
          cargo run --locked --manifest-path src-tauri/Cargo.toml --example verify_release -- artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Cryptographic verification failed' }
          gh release upload $env:GITHUB_REF_NAME artifacts/latest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Verified manifest upload failed' }
          gh release download $env:GITHUB_REF_NAME --dir artifacts-roundtrip --pattern 'latest.json'
          if ($LASTEXITCODE -ne 0) { throw 'Verified manifest could not be downloaded again' }
          if ((Get-FileHash artifacts/latest.json).Hash -ne (Get-FileHash artifacts-roundtrip/latest.json).Hash) { throw 'Uploaded manifest bytes differ' }
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$env:GITHUB_REF_NAME" --draft=false --latest
