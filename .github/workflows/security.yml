name: Security checks
on:
  push:
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
  dependencies:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - name: Audit Rust dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .tools/cargo-audit -Force | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.23.0/cargo-audit-x86_64-pc-windows-msvc-v0.23.0.zip' -OutFile .tools/cargo-audit/audit.zip
          if ((Get-FileHash .tools/cargo-audit/audit.zip -Algorithm SHA256).Hash -ne 'AAFEB61206730029601A72E669A12231F8674427E6248D02F6CB382CB36D56B4') { throw 'cargo-audit checksum mismatch' }
          Expand-Archive -LiteralPath .tools/cargo-audit/audit.zip -DestinationPath .tools/cargo-audit
          $auditBinary = Get-ChildItem .tools/cargo-audit -Recurse -Filter cargo-audit.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $auditBinary) { throw 'cargo-audit executable is missing' }
          & $auditBinary audit --file src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Rust dependency audit failed' }
