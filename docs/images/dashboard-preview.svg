<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title description">
  <title id="title">AudioFlow dashboard interface illustration</title>
  <desc id="description">An illustrated dark dashboard with a narrow sidebar, two monitor output selectors, an audio application list, and routing status. Device and application names are examples, not live hardware data.</desc>
  <style>
    text{font-family:Segoe UI,Arial,sans-serif;fill:#f5f5f5;font-size:12px}
    .small{font-size:11px;fill:#a1a1aa}.label{font-family:Consolas,monospace;font-size:9px;letter-spacing:1px;fill:#a1a1aa}.page-title{font-size:25px;font-weight:600}.metric{font-size:25px}
    .muted{fill:#a1a1aa}.blue{fill:#60a5fa}.green{fill:#34d399}.heading{font-size:13px;font-weight:600}
    .line{stroke:#34363b;stroke-width:1}.icon{fill:none;stroke:#a1a1aa;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
    .panel{fill:#161719;stroke:#34363b;stroke-width:1}.control{fill:#101113;stroke:#34363b;stroke-width:1}
  </style>
  <rect x=".5" y=".5" width="1119" height="759" rx="6" fill="#101113" stroke="#34363b"/>
