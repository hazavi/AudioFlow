[package]
name = "audioflow"
version = "0.1.0"
description = "Audio follows your screens"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "audioflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["time"] }
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Foundation", "Media_Core", "Media_Playback", "Storage", "Storage_Streams",
  "Win32_Foundation", "Win32_Devices_Display", "Win32_Graphics_Gdi",
  "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_Multimedia",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
  "Win32_System_Threading", "Win32_System_WinRT", "Win32_System_ProcessStatus",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_HiDpi",
  "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery",
  "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp"
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "unwind"

[dev-dependencies]
base64 = "0.23"
minisign-verify = "0.3"
